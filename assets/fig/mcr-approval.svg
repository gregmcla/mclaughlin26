<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposal Identity, Human Approval and Execution Lineage</title>
  <desc id="desc">Branched proposal lifecycle showing host-minted identity, deterministic validation, recorded validator rejection, human accept or reject, execution revalidation, and simulated fill, terminal drop or retryable outcome.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker><style>.k{font:700 14px Inter,ui-sans-serif,system-ui;letter-spacing:2.2px;fill:#2563EB}.t{font:750 38px Inter,ui-sans-serif,system-ui;fill:#0F172A}.s{font:400 18px Inter,ui-sans-serif,system-ui;fill:#475569}.h{font:700 17px Inter,ui-sans-serif,system-ui;fill:#0F172A}.b{font:400 13px Inter,ui-sans-serif,system-ui;fill:#475569}.tag{font:700 12px Inter,ui-sans-serif,system-ui;letter-spacing:.7px}.e{stroke:#64748B;stroke-width:2.2;fill:none;marker-end:url(#a)}.er{stroke:#B91C1C;stroke-width:2.2;fill:none;marker-end:url(#a)}.eg{stroke:#15803D;stroke-width:2.2;fill:none;marker-end:url(#a)}.foot{font:500 13px Inter,ui-sans-serif,system-ui;fill:#64748B}</style></defs>
  <rect width="1600" height="900" fill="#F8FAFC"/><text x="76" y="72" class="k">DECISION LINEAGE</text><text x="76" y="122" class="t">Proposal Identity, Human Approval and Execution Lineage</text><text x="76" y="156" class="s">A proposal can be dropped by software, vetoed by a person, filled in simulation, or retained for retry—without losing identity.</text>

  <rect x="76" y="212" width="270" height="104" rx="16" fill="#FFF7ED" stroke="#FED7AA"/><text x="98" y="241" class="tag" fill="#C2410C">MODEL OUTPUT</text><text x="98" y="271" class="h">Structured proposal</text><text x="98" y="295" class="b">buy · sell · trim</text>
  <rect x="414" y="212" width="270" height="104" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/><text x="436" y="241" class="tag" fill="#1D4ED8">HOST AUTHORITY</text><text x="436" y="271" class="h">Mint UUID</text><text x="436" y="295" class="b">before validation · never trust model ID</text>
  <rect x="752" y="212" width="270" height="104" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/><text x="774" y="241" class="tag" fill="#1D4ED8">HOST AUTHORITY</text><text x="774" y="271" class="h">Deterministic validation</text><text x="774" y="295" class="b">eligibility · sizing · constraints</text>
  <path d="M346 264H414" class="e"/><path d="M684 264H752" class="e"/>

  <path d="M1022 250 C1100 250 1076 365 1144 365" class="er"/><rect x="1144" y="320" width="326" height="90" rx="16" fill="#FEF2F2" stroke="#FCA5A5"/><text x="1166" y="350" class="tag" fill="#B91C1C">VALIDATOR REJECT</text><text x="1166" y="378" class="h">Recorded with proposal ID</text><text x="1166" y="400" class="b">explicitly never reaches the operator</text>

  <path d="M887 316V424" class="eg"/><rect x="716" y="424" width="342" height="104" rx="16" fill="#ECFDF5" stroke="#86EFAC"/><text x="738" y="454" class="tag" fill="#15803D">HUMAN BOUNDARY</text><text x="738" y="483" class="h">Decision on exact proposal ID</text><text x="738" y="506" class="b">every validator-surviving row must be decided</text>
  <path d="M716 476 C624 476 620 590 540 590" class="er"/><rect x="218" y="545" width="322" height="90" rx="16" fill="#FEF2F2" stroke="#FCA5A5"/><text x="240" y="575" class="tag" fill="#B91C1C">REJECT</text><text x="240" y="603" class="h">Recorded operator veto</text><text x="240" y="625" class="b">no simulated execution</text>
  <path d="M887 528V578" class="eg"/><rect x="716" y="578" width="342" height="104" rx="16" fill="#F5F3FF" stroke="#DDD6FE"/><text x="738" y="608" class="tag" fill="#6D28D9">APPROVE</text><text x="738" y="637" class="h">Revalidate under lock</text><text x="738" y="660" class="b">fresh price · session · drift · constraints</text>

  <path d="M887 682V730" class="e"/>
  <rect x="452" y="730" width="258" height="76" rx="14" fill="#ECFDF5" stroke="#86EFAC"/><text x="581" y="760" class="tag" fill="#15803D" text-anchor="middle">SIMULATED FILL</text><text x="581" y="785" class="b" text-anchor="middle">atomic ledger write</text>
  <rect x="758" y="730" width="258" height="76" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/><text x="887" y="760" class="tag" fill="#B91C1C" text-anchor="middle">TERMINAL DROP</text><text x="887" y="785" class="b" text-anchor="middle">recorded reason</text>
  <rect x="1064" y="730" width="258" height="76" rx="14" fill="#FFF7ED" stroke="#FED7AA"/><text x="1193" y="760" class="tag" fill="#C2410C" text-anchor="middle">RETRYABLE</text><text x="1193" y="785" class="b" text-anchor="middle">identity retained</text>
  <path d="M887 712 C887 720 581 710 581 730" class="e"/><path d="M887 712V730" class="e"/><path d="M887 712 C887 720 1193 710 1193 730" class="e"/>
  <text x="76" y="858" class="foot">Trace and evaluation lineage preserve the same proposal identity across validation, human decision and terminal outcome.</text>
</svg>
